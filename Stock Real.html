<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='54' font-size='56'%3E📊%3C/text%3E%3C/svg%3E">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#d97706">
  <link rel="manifest" href="manifest-stock-real.json">

  <!-- iOS: agregar a pantalla de inicio -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Stock Real">
  <link rel="apple-touch-icon" href="apple-touch-icon-stock.png">

  <title>📊 Stock Real · Pampero Nuñez</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f0eeeb;
      --surface: #ffffff;
      --surface2: #f5f4f1;
      --border: #e2dfd9;
      --accent: #2563eb;
      --accent2: #d97706;
      --danger: #dc2626;
      --success: #16a34a;
      --purple: #7c3aed;
      --text: #1a1a1a;
      --muted: #6b7280;
      --green: #16a34a;
      --yellow: #d97706;
      --red: #dc2626;
      --mono: 'DM Mono', monospace;
      --display: 'Syne', sans-serif;
      --body: 'DM Sans', sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: var(--body); min-height: 100vh; }

    /* ── Setup ── */
    #setup { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 2rem; }
    .setup-card { background: #fff; border: 1px solid var(--border); border-radius: 16px; padding: 3rem; max-width: 500px; width: 100%; box-shadow: 0 4px 20px rgba(0,0,0,.08); }
    .setup-card h1 { font-family: var(--display); font-size: 1.8rem; font-weight: 800; margin-bottom: .5rem; background: linear-gradient(135deg, #d97706, #2563eb); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .setup-card > p { color: var(--muted); font-size: .88rem; margin-bottom: 2rem; line-height: 1.6; }
    .setup-section { font-family: var(--mono); font-size: .68rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 1.5rem 0 .75rem; border-bottom: 1px solid var(--border); padding-bottom: .4rem; }
    label { display: block; font-size: .72rem; font-family: var(--mono); color: var(--muted); letter-spacing: .08em; text-transform: uppercase; margin-bottom: .5rem; }
    input[type="text"], input[type="password"] { width: 100%; background: #fff; border: 1px solid var(--border); border-radius: 8px; padding: .65rem 1rem; font-family: var(--mono); font-size: .88rem; color: var(--text); margin-bottom: 1.25rem; transition: border-color .15s; outline: none; }
    input[type="text"]:focus, input[type="password"]:focus { border-color: var(--accent2); box-shadow: 0 0 0 3px rgba(217,119,6,.12); }
    .btn { background: var(--accent2); color: #fff; border: none; border-radius: 10px; padding: .8rem 2rem; font-family: var(--display); font-size: .9rem; font-weight: 700; cursor: pointer; width: 100%; margin-top: .5rem; transition: background .15s; }
    .btn:hover { background: #b45309; }
    .error-msg { color: var(--danger); font-size: .82rem; margin-top: .75rem; display: none; }

    /* ── Dashboard ── */
    #dashboard { display: none; flex-direction: column; min-height: 100vh; }
    header { background: #fff; border-bottom: 1px solid var(--border); padding: .8rem 1.5rem; display: flex; align-items: center; gap: 1rem; position: sticky; top: 0; z-index: 100; }
    .header-left h1 { font-family: var(--display); font-size: 1rem; font-weight: 800; }
    .header-left span { font-size: .72rem; color: var(--muted); font-family: var(--mono); }
    .header-right { margin-left: auto; display: flex; align-items: center; gap: .6rem; }
    .last-update { font-family: var(--mono); font-size: .68rem; color: var(--muted); }
    .btn-sm { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: .4rem .9rem; font-size: .78rem; font-family: var(--mono); cursor: pointer; color: var(--text); transition: background .12s; white-space: nowrap; }
    .btn-sm:hover { background: var(--border); }
    .btn-sm.danger { color: var(--danger); }

    nav { background: #fff; border-bottom: 1px solid var(--border); padding: 0 1.5rem; display: flex; gap: 0; }
    .tab-btn { background: none; border: none; border-bottom: 2px solid transparent; padding: .85rem 1.25rem; font-family: var(--body); font-size: .88rem; font-weight: 500; color: var(--muted); cursor: pointer; transition: color .15s, border-color .15s; white-space: nowrap; }
    .tab-btn.active { color: var(--accent2); border-bottom-color: var(--accent2); }
    .tab-btn:hover:not(.active) { color: var(--text); }

    main { flex: 1; padding: 1.5rem; max-width: 1400px; width: 100%; margin: 0 auto; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* ── KPIs ── */
    .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: .75rem; margin-bottom: 1.5rem; }
    .kpi { background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 1rem 1.25rem; border-left: 3px solid var(--kpi-color, var(--accent)); }
    .kpi-label { font-size: .68rem; font-family: var(--mono); text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin-bottom: .3rem; }
    .kpi-value { font-family: var(--display); font-size: 2rem; font-weight: 800; color: var(--kpi-color, var(--accent)); line-height: 1; }
    .kpi-sub { font-size: .72rem; color: var(--muted); margin-top: .25rem; }

    /* ── Panels ── */
    .panel { background: #fff; border: 1px solid var(--border); border-radius: 12px; margin-bottom: 1.25rem; overflow: hidden; }
    .panel-header { display: flex; align-items: center; justify-content: space-between; padding: .9rem 1.25rem; border-bottom: 1px solid var(--border); gap: .75rem; flex-wrap: wrap; }
    .panel-title { font-family: var(--display); font-size: .9rem; font-weight: 700; }
    .badge { font-family: var(--mono); font-size: .7rem; border-radius: 6px; padding: 2px 8px; background: var(--surface2); border: 1px solid var(--border); color: var(--muted); }
    .badge.danger { background: #fee2e2; border-color: #fecaca; color: #b91c1c; }
    .badge.success { background: #dcfce7; border-color: #bbf7d0; color: #15803d; }
    .badge.warning { background: #fef3c7; border-color: #fde68a; color: #b45309; }

    /* ── Precio destacado ── */
    .precio-tag { font-family: var(--display); font-size: 1rem; font-weight: 800; color: var(--success); background: #dcfce7; border: 1px solid #bbf7d0; border-radius: 8px; padding: .2rem .7rem; line-height: 1.2; white-space: nowrap; }
    .precio-tag-sm { font-family: var(--display); font-weight: 800; color: var(--success); background: #dcfce7; border: 1px solid #bbf7d0; border-radius: 6px; padding: 1px 8px; font-size: .82rem; white-space: nowrap; }

    /* ── Filter bar ── */
    .filter-bar { display: flex; align-items: center; gap: .75rem; padding: .75rem 1.25rem; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
    .filter-label { font-family: var(--mono); font-size: .7rem; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; white-space: nowrap; }
    .filter-bar input[type="text"] { margin-bottom: 0; max-width: 200px; font-size: .82rem; padding: .38rem .8rem; border-radius: 8px; }
    .filter-bar select { font-family: var(--mono); font-size: .82rem; border: 1.5px solid var(--border); border-radius: 8px; padding: .38rem .7rem; background: #fff; color: var(--text); max-width: 200px; outline: none; cursor: pointer; }
    .filter-bar select:focus { border-color: var(--accent2); }
    .btn-clear { background: #fff; border: 1px solid var(--border); border-radius: 8px; padding: .38rem .85rem; color: var(--muted); font-size: .78rem; cursor: pointer; white-space: nowrap; }
    .btn-clear:hover { background: var(--surface2); }
    .sf-dd-item { padding: .42rem .9rem; cursor: pointer; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: .35rem; flex-wrap: wrap; }
    .sf-dd-item:last-child { border-bottom: none; }
    .sf-dd-item:hover { background: var(--surface2); }
    .sf-dd-item.sf-dd-selected { background: #eff6ff; }
    .sf-dd-check { width: 1rem; text-align: center; font-size: .8rem; color: var(--accent2); font-weight: 700; flex-shrink: 0; }
    .sf-chip { display: inline-flex; align-items: center; gap: .3rem; background: #eff6ff; border: 1.5px solid #bfdbfe; border-radius: 20px; padding: .22rem .55rem .22rem .75rem; font-family: var(--mono); font-size: .75rem; color: #1d4ed8; max-width: 100%; }
    .sf-chip-remove { background: none; border: none; cursor: pointer; color: #93c5fd; font-size: .8rem; line-height: 1; padding: 0 .1rem; display: flex; align-items: center; }
    .sf-chip-remove:hover { color: #1d4ed8; }

    /* ── Table ── */
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: .88rem; }
    th { font-family: var(--mono); font-size: .68rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); padding: .6rem 1rem; text-align: left; background: var(--surface2); border-bottom: 1px solid var(--border); white-space: nowrap; }
    td { padding: .6rem 1rem; border-bottom: 1px solid var(--surface2); vertical-align: middle; }
    .table-wrap th:first-child, .table-wrap td:first-child { position: sticky; left: 0; z-index: 2; box-shadow: 2px 0 4px -2px rgba(0,0,0,.15); }
    .table-wrap th:first-child { z-index: 3; }
    .table-wrap tbody td:first-child { background: var(--surface); }
    .table-wrap tr:hover td:first-child { background: #fafaf9; }
    .table-wrap tbody tr:last-child td:first-child { background: var(--surface2); }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #fafaf9; }
    td small { display: block; font-size: .72rem; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 260px; }
    .group-cell { vertical-align: top; border-right: 2px solid var(--border); }
    .group-first td.group-cell { border-top: 2px solid var(--border); }

    /* ── Mono val ── */
    .mono-val { font-family: var(--mono); font-size: .88rem; font-weight: 600; }

    /* ── Stock badge ── */
    .stock-ok  { font-family: var(--mono); font-size: .85rem; font-weight: 700; background: #dcfce7; color: #15803d; border: 1px solid #bbf7d0; border-radius: 6px; padding: 2px 10px; }
    .stock-low { font-family: var(--mono); font-size: .85rem; font-weight: 700; background: #fef3c7; color: #b45309; border: 1px solid #fde68a; border-radius: 6px; padding: 2px 10px; }
    .stock-zero { font-family: var(--mono); font-size: .85rem; font-weight: 700; background: #f3f4f6; color: #6b7280; border: 1px solid #e5e7eb; border-radius: 6px; padding: 2px 10px; }
    .stock-neg { font-family: var(--mono); font-size: .85rem; font-weight: 700; background: #fee2e2; color: #b91c1c; border: 1px solid #fecaca; border-radius: 6px; padding: 2px 10px; }

    /* ── Talle badge ── */
    .talle-badge { font-family: var(--mono); font-size: .78rem; font-weight: 600; background: var(--surface2); border: 1px solid var(--border); border-radius: 4px; padding: 1px 7px; }

    /* ── SKU tags ── */
    .sku-sin-pedir { background: #fee2e2; color: #b91c1c; border: 1px solid #fecaca; }
    .sku-pedido    { background: #fef3c7; color: #b45309; border: 1px solid #fde68a; }
    .sku-ok        { background: #dcfce7; color: #15803d; border: 1px solid #bbf7d0; }
    .sku-tag { font-family: var(--mono); font-size: .72rem; border-radius: 4px; padding: 1px 7px; display: inline-block; }

    /* ── SKU groups (compras) ── */
    .sku-group { border-bottom: 1px solid var(--border); }
    .sku-group:last-child { border-bottom: none; }
    .sku-group-rows { display: none; }
    .sku-group.open > .sku-group-rows { display: block; }
    .sku-group-header { display: flex; align-items: center; gap: .75rem; padding: .85rem 1.25rem; cursor: pointer; user-select: none; transition: background .12s; }
    .sku-group-header:hover { background: var(--surface2); }
    .sku-group-code { font-family: var(--display); font-size: .95rem; font-weight: 700; }
    .sku-group-total { font-family: var(--mono); font-size: .88rem; font-weight: 700; background: #fee2e2; color: #b91c1c; border: 1px solid #fecaca; border-radius: 6px; padding: 2px 9px; }
    .sku-group-arrow { margin-left: auto; color: var(--muted); font-size: .8rem; transition: transform .2s; }
    .sku-group.open > .sku-group-header > .sku-group-arrow { transform: rotate(90deg); }

    .sku-sub-row { display: grid; grid-template-columns: 80px 80px 1fr 1fr 52px; gap: .5rem; align-items: center; padding: .55rem 1.25rem .55rem 2.5rem; border-top: 1px solid var(--surface2); cursor: pointer; transition: background .12s; }
    .sku-sub-row:hover { background: #fafaf9; }
    .sku-sub-label { font-family: var(--mono); font-size: .6rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); display: block; }
    .sku-pedidos-expand { display: none; padding: .5rem 1.25rem .75rem 3rem; border-top: 1px solid var(--surface2); background: var(--surface2); }
    .sku-pedido-item { display: flex; align-items: center; gap: .75rem; padding: .4rem 0; border-bottom: 1px solid var(--border); }
    .sku-pedido-item:last-child { border-bottom: none; }

    /* ── Cross-ref stock pill ── */
    .xref-ok     { font-family: var(--mono); font-size: .68rem; background: #dcfce7; color: #15803d; border: 1px solid #bbf7d0; border-radius: 4px; padding: 1px 7px; white-space: nowrap; }
    .xref-partial { font-family: var(--mono); font-size: .68rem; background: #fef3c7; color: #b45309; border: 1px solid #fde68a; border-radius: 4px; padding: 1px 7px; white-space: nowrap; }
    .xref-none   { font-family: var(--mono); font-size: .68rem; background: #fee2e2; color: #b91c1c; border: 1px solid #fecaca; border-radius: 4px; padding: 1px 7px; white-space: nowrap; }

    /* ── ABC badge ── */
    .abc-a { background: #dcfce7; color: #15803d; border: 1px solid #bbf7d0; font-family: var(--mono); font-size: .62rem; font-weight: 700; border-radius: 4px; padding: 1px 6px; }
    .abc-b { background: #fef3c7; color: #b45309; border: 1px solid #fde68a; font-family: var(--mono); font-size: .62rem; font-weight: 700; border-radius: 4px; padding: 1px 6px; }
    .abc-c { background: #f3f4f6; color: #6b7280; border: 1px solid #e5e7eb; font-family: var(--mono); font-size: .62rem; font-weight: 700; border-radius: 4px; padding: 1px 6px; }

    /* ── Status pill ── */
    .status-pill { display: inline-block; font-family: var(--mono); font-size: .7rem; border-radius: 4px; padding: 1px 7px; border: 1px solid; }
    .sp-confirmado { background: #fef3c7; color: #92400e; border-color: #fde68a; }
    .sp-proceso    { background: #dbeafe; color: #1e40af; border-color: #bfdbfe; }
    .sp-completo   { background: #dcfce7; color: #15803d; border-color: #bbf7d0; }
    .sp-despacho   { background: #ede9fe; color: #5b21b6; border-color: #ddd6fe; }
    .sp-default    { background: var(--surface2); color: var(--muted); border-color: var(--border); }

    /* ── Dias chip ── */
    .dias-chip { font-family: var(--mono); font-size: .75rem; font-weight: 700; border-radius: 5px; padding: 1px 7px; white-space: nowrap; }
    .dias-green  { background: #dcfce7; color: #15803d; }
    .dias-yellow { background: #fef3c7; color: #b45309; }
    .dias-red    { background: #fee2e2; color: #b91c1c; }

    /* ── Ventas charts ── */
    .v-charts-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1.25rem; }
    .v-charts-row-3 { display: grid; grid-template-columns: 1fr 1fr 1.4fr; gap: 1rem; margin-bottom: 1.25rem; }
    .v-charts-row-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; margin-bottom: 1.25rem; }
    @media (max-width: 1100px) { .v-charts-row-3 { grid-template-columns: 1fr 1fr; } }
    @media (max-width: 900px) { .v-charts-row { grid-template-columns: 1fr; } .v-charts-row-3 { grid-template-columns: 1fr; } .v-charts-row-4 { grid-template-columns: 1fr 1fr; } }
    @media (max-width: 640px) { .v-charts-row-4 { grid-template-columns: 1fr; } }
    .v-filter-active { background: #eff6ff !important; border-color: #bfdbfe !important; color: #1d4ed8 !important; }
    .chart-clickable { cursor: pointer; }
    .chart-clickable:hover { background: var(--surface2); }

    /* ── Link ── */
    .trello-link { font-family: var(--mono); font-size: .7rem; color: var(--accent); text-decoration: none; }
    .trello-link:hover { text-decoration: underline; }

    /* ── Loading / Empty ── */
    .loading { text-align: center; padding: 4rem 2rem; color: var(--muted); font-size: .9rem; }
    .empty { padding: 2rem 1.25rem; text-align: center; color: var(--muted); font-size: .88rem; }

    /* ── Debug panel ── */
    #debugPanel { display: none; background: #111; color: #0f0; font-family: var(--mono); font-size: .72rem; padding: 1rem; max-height: 200px; overflow-y: auto; margin: 1rem; border-radius: 8px; }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: #d1cdc7; border-radius: 3px; }

    /* ── Matrix tabla compras ── */
    .pc-matrix { border-collapse: collapse; font-family: var(--mono); font-size: .82rem; }
    .pc-matrix th { background: var(--surface2); border: 1px solid var(--border); padding: .35rem .55rem; font-size: .68rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); text-align: center; white-space: nowrap; }
    .pc-matrix th.col-color { text-align: left; min-width: 90px; }
    .pc-matrix td { border: 1px solid var(--border); padding: .3rem .4rem; text-align: center; vertical-align: middle; }
    .pc-matrix td.row-color { font-weight: 600; text-align: left; padding: .3rem .7rem; white-space: nowrap; background: var(--surface2); }
    .pc-matrix td.row-total, .pc-matrix th.col-total { border-left: 2px solid var(--border); }
    .pc-matrix tr.foot-row td { border-top: 2px solid var(--border); font-weight: 700; }
    .pc-cell-need { font-weight: 700; border-radius: 5px; padding: 2px 7px; cursor: pointer; display: inline-block; min-width: 30px; text-align: center; transition: opacity .1s; }
    .pc-cell-need:hover { opacity: .78; }
    .pc-cell-ok { color: #15803d; cursor: pointer; font-size: .8rem; }
    .pc-cell-ok:hover { opacity: .7; }

    /* ── Modal detalle stock ── */
    #pcStockModal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.48); z-index: 9999; align-items: center; justify-content: center; }
    .pc-modal-card { background: #fff; border-radius: 16px; max-width: 440px; width: 92%; box-shadow: 0 12px 40px rgba(0,0,0,.22); overflow: hidden; }
    .pc-modal-hdr { background: var(--surface2); padding: .9rem 1.25rem; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
    .pc-modal-body { padding: 1.25rem; display: grid; grid-template-columns: 1fr 1fr; gap: .85rem; }
    .pc-modal-cell { background: var(--surface2); border-radius: 8px; padding: .7rem .9rem; }
    .pc-modal-cell-label { font-family: var(--mono); font-size: .58rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin-bottom: .25rem; }
    .pc-modal-cell-val { font-family: var(--mono); font-size: 1.3rem; font-weight: 800; line-height: 1.1; }
    .pc-modal-cell-sub { font-family: var(--mono); font-size: .65rem; color: var(--muted); margin-top: 2px; }
    .pc-modal-footer { padding: .75rem 1.25rem 1.25rem; }
    .pc-modal-formula { font-family: var(--mono); font-size: .65rem; color: var(--muted); margin-bottom: .5rem; }
    .pc-modal-result { text-align: center; font-family: var(--display); font-size: 1.5rem; font-weight: 800; border-radius: 10px; padding: .5rem 1rem; }

    @media (max-width: 640px) {
      header { flex-direction: column; align-items: flex-start; padding: .6rem 1rem; gap: .4rem; }
      .header-right { width: 100%; flex-wrap: nowrap; gap: .4rem; }
      .btn-sm { flex: 1; text-align: center; font-size: .72rem; padding: .4rem .5rem; }
      main { padding: .75rem; }
      .kpi-grid { grid-template-columns: 1fr 1fr; gap: .5rem; }
      .kpi-value { font-size: 1.6rem; }
      .filter-bar { flex-direction: column; align-items: stretch; }
      .filter-bar input[type="text"], .filter-bar select { max-width: 100%; }
      .sku-sub-row { grid-template-columns: 70px 70px 1fr 52px; }
      nav { overflow-x: auto; scrollbar-width: none; }
      nav::-webkit-scrollbar { display: none; }
      .tab-btn { padding: .7rem .9rem; font-size: .8rem; }
    }
  </style>
</head>
<body>

<!-- ═══════════════════════════ SETUP ═══════════════════════════ -->
<div id="setup">
  <div class="setup-card">
    <h1>📊 Stock Real Pampero Nuñez</h1>

  function norm(s) { return (s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); }

  // Lookup O(1) en lugar de O(n) con find()
  const CATALOG_UPPER = Object.fromEntries(Object.entries(CATALOG).map(([k,v]) => [k.toUpperCase(), v]));
  function getCatalog(codigo) {
    if (!codigo) return null;
    return CATALOG_UPPER[codigo.toUpperCase()] || null;
  }

    if (codigo) {
      const p = priceData.byCodigo[codigo.toUpperCase()];
      if (p !== undefined) return p;

    if (desc) {
      const p = priceData.byDesc[norm(desc)];
      if (p !== undefined) return p;
    }
    return null;
  }

  function parseStockNumber(v) {
    if (v === null || v === undefined) return 0;
    if (typeof v === 'number') return v;
    const s = String(v).trim();
    if (!s) return 0;
    // Soporta formato argentino: 1.234,50 / -3,00 y formato simple: 1234.50
    const cleaned = s.includes(',')
      ? s.replace(/\./g, '').replace(',', '.').replace(/[^0-9.\-]/g, '')
      : s.replace(/[^0-9.\-]/g, '');
    const n = parseFloat(cleaned);
    return isNaN(n) ? 0 : n;
  }

  function cleanStockText(v) {
    return String(v ?? '').replace(/\u00a0/g, ' ').trim();
  }

  function makeStockRow({ articulo, desc, color, colorDesc, talle, cordoba2, cordoba }) {
    const art = cleanStockText(articulo);
    if (!art || norm(art) === 'articulo') return null;
    const info = getCatalog(art);
    return {
      articulo: art,
      desc: cleanStockText(desc),
      color: cleanStockText(color),
      colorDesc: cleanStockText(colorDesc),
      talle: cleanStockText(talle),
      stock: parseStockNumber(cordoba) + parseStockNumber(cordoba2),
      proveedores: info ? info.proveedores : []
    };
  }

  function applyStockRows(rawRows, sourceLabel) {
    let omittedHeader = 0, omittedNoArticulo = 0;
    stockData = rawRows.map(r => {
      const row = makeStockRow(r);
      if (!row) {
        const art = cleanStockText(r.articulo);
        if (norm(art) === 'articulo') omittedHeader++;
        else omittedNoArticulo++;
      }
      return row;
    }).filter(Boolean);

    const first = stockData[0] ? `${stockData[0].articulo}-${stockData[0].color}-${stockData[0].talle}` : '—';
    const last = stockData[stockData.length - 1] ? `${stockData[stockData.length - 1].articulo}-${stockData[stockData.length - 1].color}-${stockData[stockData.length - 1].talle}` : '—';
    log(`✓ Stock ${sourceLabel}: ${stockData.length} filas útiles / ${rawRows.length} filas crudas (${omittedNoArticulo} sin Artículo, ${omittedHeader} encabezados). Primero: ${first}. Último: ${last}`);
  }

  function applyStockCSV(rows, sourceLabel = 'CSV') {
    const headers = (rows[0] || []).map(h => norm(h));
    const findCol = (...names) => {
      const wanted = names.map(norm);
      for (const w of wanted) {
        const exact = headers.findIndex(h => h === w);
        if (exact >= 0) return exact;
      }
      for (const w of wanted) {
        const partial = headers.findIndex(h => h.includes(w));
        if (partial >= 0) return partial;
      }
      return -1;
    };

    const idx = {
      articulo: findCol('articulo', 'artículo', 'codigo', 'código', 'sku'),
      desc: findCol('articulo descripcion', 'artículo descripción', 'descripcion articulo', 'descripción articulo'),
      color: findCol('color'),
      colorDesc: findCol('color descripcion', 'color descripción', 'descripcion color', 'descripción color'),
      talle: findCol('talle', 'talla'),
      cordoba2: findCol('cordoba2', 'córdoba2'),
      cordoba: findCol('cordoba', 'córdoba')
    };

    // Fallback posicional del reporte zNube: A Grupo, B Artículo, C Desc, D Color, E Color Desc, F Talle, G Talle Desc, H CORDOBA2, I CORDOBA
    if (idx.articulo < 0 && (rows[0] || []).length >= 9) {
      idx.articulo = 1; idx.desc = 2; idx.color = 3; idx.colorDesc = 4; idx.talle = 5; idx.cordoba2 = 7; idx.cordoba = 8;
    }
    log(`Stock ${sourceLabel}: columnas idx art=${idx.articulo}, desc=${idx.desc}, color=${idx.color}, talle=${idx.talle}, cordoba2=${idx.cordoba2}, cordoba=${idx.cordoba}`);

    const rawRows = rows.slice(1)
      .filter(row => row && row.some(c => cleanStockText(c) !== ''))
      .map(row => ({
        articulo: idx.articulo >= 0 ? row[idx.articulo] : '',
        desc: idx.desc >= 0 ? row[idx.desc] : '',
        color: idx.color >= 0 ? row[idx.color] : '',
        colorDesc: idx.colorDesc >= 0 ? row[idx.colorDesc] : '',
        talle: idx.talle >= 0 ? row[idx.talle] : '',
        cordoba2: idx.cordoba2 >= 0 ? row[idx.cordoba2] : '',
        cordoba: idx.cordoba >= 0 ? row[idx.cordoba] : ''
      }));

    applyStockRows(rawRows, sourceLabel);
  }

  function gvizJsonp(url, timeoutMs = 15000) {
    return new Promise((resolve, reject) => {
      const cb = '__gviz_' + Date.now() + '_' + Math.random().toString(36).slice(2);
      const sep = url.includes('?') ? '&' : '?';
      const finalUrl = `${url}${sep}tqx=out:json;responseHandler:${cb}&_=${Date.now()}`;
      log(`Fetching ${finalUrl.replace(/responseHandler:[^&]+/, 'responseHandler:CB')}`);
      const script = document.createElement('script');
      const cleanup = () => { try { delete window[cb]; } catch(e) { window[cb] = undefined; } script.remove(); };
      const timer = setTimeout(() => { cleanup(); reject(new Error('Timeout al cargar Sheets.')); }, timeoutMs);
      window[cb] = data => { clearTimeout(timer); cleanup(); resolve(data); };
      script.onerror = () => { clearTimeout(timer); cleanup(); reject(new Error('Error al cargar script de Sheets — verificá que la hoja sea pública.')); };
      script.src = finalUrl;
      document.head.appendChild(script);
    });
  }

  function rowsFromGvizTable(data, sourceLabel) {
    if (!data || data.status === 'error') {
      throw new Error('Error de Sheets: ' + ((data && data.errors) || []).map(e => e.message).join(', '));
    }
    const rows = (data.table && data.table.rows) ? data.table.rows : [];
    const rawRows = [];
    rows.forEach(row => {
      const c = row.c || [];
      // Cuando pedimos range=B:I, las posiciones quedan:
      // 0 Artículo, 1 Desc, 2 Color, 3 Color Desc, 4 Talle, 5 Talle Desc, 6 CORDOBA2, 7 CORDOBA
      const cell = i => (c[i] && c[i].v !== undefined) ? c[i].v : '';
      const obj = {
        articulo: cell(0),
        desc: cell(1),
        color: cell(2),
        colorDesc: cell(3),
        talle: cell(4),
        cordoba2: cell(6),
        cordoba: cell(7)
      };
      if ([obj.articulo, obj.desc, obj.color, obj.colorDesc, obj.talle, obj.cordoba2, obj.cordoba].some(v => cleanStockText(v) !== '')) rawRows.push(obj);
    });
    log(`Stock ${sourceLabel}: gviz devolvió ${rawRows.length} filas crudas`);
    return rawRows;
  }

  async function loadStockGvizFullRange() {
    // CLAVE: empezar en B, no en A. La columna A (Grupo) viene casi siempre vacía y puede hacer que gviz corte mal el rango.
    const url = `https://docs.google.com/spreadsheets/d/${SHEETS_ID}/gviz/tq?gid=${SHEETS_GID}&range=B1:I10000&headers=0`;
    const data = await gvizJsonp(url);
    return rowsFromGvizTable(data, 'gviz rango completo B1:I10000');
  }

  async function loadStockGvizByBlocks() {
    const PAGE = 1000;
    let all = [];
    for (let startRow = 1; startRow <= 20000; startRow += PAGE) {
      const endRow = startRow + PAGE - 1;
      const url = `https://docs.google.com/spreadsheets/d/${SHEETS_ID}/gviz/tq?gid=${SHEETS_GID}&range=B${startRow}:I${endRow}&headers=0`;
      const data = await gvizJsonp(url);
      const pageRows = rowsFromGvizTable(data, `gviz bloque B${startRow}:I${endRow}`);
      all = all.concat(pageRows);
      log(`Stock gviz bloques: B${startRow}:I${endRow} => ${pageRows.length} filas (acum ${all.length})`);
      if (pageRows.length < PAGE) break;
    }
    return all;
  }

  async function fetchTextWithTimeout(url, timeoutMs = 12000) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), timeoutMs);
    try {
      const res = await fetch(url, { cache: 'no-store', signal: ctrl.signal });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return await res.text();
    } finally {
      clearTimeout(timer);
    }
  }

  async function loadStockExportCSVReal() {
    const url = `https://docs.google.com/spreadsheets/d/${SHEETS_ID}/export?format=csv&gid=${SHEETS_GID}&_=${Date.now()}`;
    log(`Fetching Stock CSV real: ${url}`);
    const text = await fetchTextWithTimeout(url);
    const rows = parseCSV(text);
    if (rows.length <= 1) throw new Error('CSV real vacío o insuficiente');
    return rows;
  }

  async function loadSheetData() {
    // Estrategia principal: gviz JSONP con rango explícito B:I.
    // Esto mantiene lectura automática del Google Sheet y evita el bug de SELECT + LIMIT/OFFSET que cortaba filas.
    try {
      const rawRows = await loadStockGvizFullRange();
      if (rawRows.length > 1) { applyStockRows(rawRows, 'gviz rango completo B1:I10000'); return; }
      log('Stock gviz rango completo no devolvió filas suficientes, probando bloques…');
    } catch (e) {
      log(`Stock gviz rango completo falló (${e.message}), probando bloques…`);
    }

    try {
      const rawRows = await loadStockGvizByBlocks();
      if (rawRows.length > 1) { applyStockRows(rawRows, 'gviz por bloques B:I'); return; }
      log('Stock gviz por bloques no devolvió filas suficientes, probando CSV real…');
    } catch (e) {
      log(`Stock gviz por bloques falló (${e.message}), probando CSV real…`);
    }

    // Fallback: CSV exportado del Sheets real. Puede fallar por CORS según navegador/permisos, por eso no es la vía principal.
    try {
      const rows = await loadStockExportCSVReal();
      applyStockCSV(rows, 'CSV real export');
      return;
    } catch (e) {
      log(`Stock CSV real falló (${e.message}), probando CSV publicado…`);
    }

    // Último fallback: CSV publicado. Lo dejamos solo como respaldo para no romper el tablero si gviz falla.
    if (STOCK_PUB_ID) {
      try {
        const csvUrl = `https://docs.google.com/spreadsheets/d/e/${STOCK_PUB_ID}/pub?gid=${SHEETS_GID}&single=true&output=csv&_=${Date.now()}`;
        log(`Fetching Stock CSV publicado: ${csvUrl}`);
        const text = await fetchTextWithTimeout(csvUrl);
        const rows = parseCSV(text);
        if (rows.length > 1) { applyStockCSV(rows, 'CSV publicado'); return; }
      } catch(e) {
        log(`Stock CSV publicado falló (${e.message})`);
      }
    }

    throw new Error('No se pudo cargar stock desde Google Sheets por ninguna vía.');
  }

        const endRow = startRow + PAGE - 1;
        const url = `https://docs.google.com/spreadsheets/d/${PRICE_SHEETS_ID}/gviz/tq?gid=${PRICE_SHEETS_GID}&range=A${startRow}:F${endRow}&headers=0`;
        let data;
        try {
          data = await gvizJsonp(url, 20000);
        } catch (e) {
          log(`Precios bloque A${startRow}:F${endRow} falló (${e.message})`);
          break;
        }
        const rows = (data.table && data.table.rows) ? data.table.rows : [];
        rows.forEach(row => {
          const c = row.c || [];
          const cell = i => (c[i] && c[i].v !== undefined) ? c[i].v : '';
          const codigo = cleanStockText(cell(0));
          const desc = cleanStockText(cell(1));
          if (norm(codigo).includes('articulo') || norm(desc) === 'articulo descripcion') return;
          if (!codigo && !desc) return;
          const precio = parseStockNumber(cell(5));
          if (!precio) return;
          if (codigo) byCodigo[codigo.toUpperCase()] = precio;
          if (desc) byDesc[norm(desc)] = precio;
        });
        totalRows += rows.length;
        log(`Precios bloque A${startRow}:F${endRow} => ${rows.length} filas (acum ${totalRows})`);
        priceData = { byCodigo, byDesc };
        if (rows.length < PAGE) break;
      }
      log(`✓ Precios: ${Object.keys(byCodigo).length} códigos / ${Object.keys(byDesc).length} descripciones cargadas`);
    } catch (e) {
      log(`Precios: falló la carga (${e.message})`);
    } finally {
      priceData = { byCodigo, byDesc };
    }
  }

  // ═══════════════════════════════════════════════════════════
  // COMBINED LOAD
  // ═══════════════════════════════════════════════════════════
  async function loadData() {
    debugLog = [];
    document.getElementById('stockLoading').style.display = 'block';
    document.getElementById('stockContent').style.display = 'none';
    try {
      await loadSheetData();
      document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString('es-AR');
      renderStock();
    } catch (e) {
      document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString('es-AR');
      document.getElementById('stockLoading').innerHTML = `<span style="color:var(--danger)">Error stock: ${e.message}</span>`;
      return;
    }
    // Los precios se cargan aparte y no bloquean la aparición de los artículos:
    // en celular la hoja de precios (bloques de a 15.000 filas) puede tardar más.
    loadPriceData().then(() => renderStock());
  }

  // ═══════════════════════════════════════════════════════════
  // RENDER — STOCK TAB
  // ═══════════════════════════════════════════════════════════
  function buildAllArticulos() {
    const seen = new Set();
    const list = [];
    stockData.forEach(r => {
      if (!seen.has(r.articulo)) {
        seen.add(r.articulo);
        list.push({ codigo: r.articulo, desc: r.desc });
      }
    });
    return list.sort((a, b) => a.codigo.localeCompare(b.codigo));
  }

  function showSfDropdown() {
    const inp = document.getElementById('sfTextInput');
    const dd = document.getElementById('sfDropdown');
    if (!inp || !dd) return;
    const t = norm(inp.value);
    if (!t) { dd.style.display = 'none'; return; }
    const all = buildAllArticulos();
    const matches = all.filter(a => norm(a.codigo).includes(t) || norm(a.desc).includes(t)).slice(0, 15);
    if (!matches.length) { dd.style.display = 'none'; return; }
    dd.innerHTML = matches.map(a => {
      const sel = sfSelectedArticulos.has(a.codigo);
      const esc = a.codigo.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
      const precio = getPrice(a.codigo, a.desc);
      return `<div class="sf-dd-item${sel ? ' sf-dd-selected' : ''}" onmousedown="toggleArticulo('${esc}')">
        <span class="sf-dd-check">${sel ? '✓' : ''}</span>
        <span style="font-family:var(--mono);font-weight:700;color:var(--accent2);font-size:.85rem">${a.codigo}</span>
        ${a.desc ? `<span style="color:var(--muted);font-size:.8rem;margin-left:.4rem">${a.desc}</span>` : ''}
        ${precio != null && precio > 0 ? `<span class="precio-tag-sm" style="margin-left:auto">${formatPrice(precio)}</span>` : ''}
      </div>`;
    }).join('');
    dd.style.display = 'block';
  }

  function toggleArticulo(codigo) {
    if (sfSelectedArticulos.has(codigo)) {
      sfSelectedArticulos.delete(codigo);
    } else {
      sfSelectedArticulos.add(codigo);
    }
    renderChips();
    showSfDropdown();
    renderStockResults();
  }

  function renderChips() {
    const container = document.getElementById('sfChips');
    if (!container) return;
    if (sfSelectedArticulos.size === 0) { container.style.display = 'none'; container.innerHTML = ''; return; }
    const all = buildAllArticulos();
    container.style.display = 'flex';
    container.innerHTML = [...sfSelectedArticulos].map(c => {
      const art = all.find(a => a.codigo === c);
      const label = art && art.desc ? `${c} — ${art.desc}` : c;
      const esc = c.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
      return `<span class="sf-chip">${label}<button class="sf-chip-remove" onmousedown="toggleArticulo('${esc}')">✕</button></span>`;
    }).join('');
  }

  const TALLE_ORDER = ['MCH','XS','CH','S','M','G','L','MG','XL','MMG','XXL','2XL','2MG','3XL','3MG','4XL','4MG','5XL','5MG'];
  function sortTalles(talles) {
    return [...talles].sort((a, b) => {
      const ia = TALLE_ORDER.indexOf(a.toUpperCase());
      const ib = TALLE_ORDER.indexOf(b.toUpperCase());
      if (ia >= 0 && ib >= 0) return ia - ib;
      if (ia >= 0) return -1;
      if (ib >= 0) return 1;
      const na = parseFloat(a), nb = parseFloat(b);
      if (!isNaN(na) && !isNaN(nb)) return na - nb;
      return a.localeCompare(b);
    });
  }

  function buildStockTable(rows, titulo, subtitulo) {
    const talles = sortTalles([...new Set(rows.map(r => String(r.talle)))]);
    const colors = [...new Set(rows.map(r => r.color))].sort();
    const colorDescMap = {};
    rows.forEach(r => { if (r.colorDesc) colorDescMap[r.color] = r.colorDesc; });

    // sum[color][talle] = total stock
    const sum = {};
    rows.forEach(r => {
      if (!sum[r.color]) sum[r.color] = {};
      const t = String(r.talle);
      sum[r.color][t] = (sum[r.color][t] || 0) + r.stock;
    });

    const totalStock = rows.reduce((s, r) => s + Math.max(0, r.stock), 0);
    const sinStock = rows.filter(r => r.stock <= 0).length;

    const thTalles = talles.map(t => `<th style="text-align:center;min-width:52px">${t}</th>`).join('');

    const tbodyRows = colors.map(color => {
      const colorDesc = colorDescMap[color] || '';
      const cells = talles.map(t => {
        const v = sum[color] && sum[color][t] != null ? sum[color][t] : null;
        if (v === null) return `<td style="text-align:center;color:var(--muted);font-family:var(--mono);font-size:.75rem">—</td>`;
        return `<td style="text-align:center">${stockBadge(v)}</td>`;
      }).join('');
      const rowTotal = talles.reduce((s, t) => s + Math.max(0, (sum[color] && sum[color][t]) || 0), 0);
      return `<tr>
        <td><span class="mono-val">${color}</span>${colorDesc ? `<small>${colorDesc}</small>` : ''}</td>
        ${cells}
        <td style="text-align:center;border-left:1px solid var(--border)"><strong style="font-family:var(--mono);font-size:.85rem">${Math.round(rowTotal)}</strong></td>
      </tr>`;
    }).join('');

    const totalCells = talles.map(t => {
      const total = colors.reduce((s, color) => s + Math.max(0, (sum[color] && sum[color][t]) || 0), 0);
      return `<td style="text-align:center"><span style="font-family:var(--mono);font-size:.8rem;font-weight:700;color:var(--muted)">${Math.round(total) || '—'}</span></td>`;
    }).join('');

    return `
      <div class="panel" style="margin-bottom:1.25rem">
        <div class="panel-header">
          <div style="flex:1;min-width:0">
            <div style="display:flex;align-items:center;gap:.75rem;flex-wrap:wrap">${titulo}</div>
            ${subtitulo ? `<div style="font-size:.72rem;color:var(--muted);margin-top:3px;font-family:var(--mono)">${subtitulo}</div>` : ''}
          </div>
          <div style="display:flex;gap:.5rem;align-items:center;flex-wrap:wrap">
            <span class="badge success">${Math.round(totalStock)} u. en stock</span>
            ${sinStock > 0 ? `<span class="badge danger">${sinStock} sin stock</span>` : ''}
            <span class="badge">${colors.length} colores · ${talles.length} talles</span>
          </div>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Color</th>${thTalles}<th style="text-align:center;border-left:1px solid var(--border)">Total</th></tr></thead>
            <tbody>
              ${tbodyRows}
              <tr style="background:var(--surface2)">
                <td style="font-family:var(--mono);font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)">Total</td>
                ${totalCells}
                <td style="text-align:center;border-left:1px solid var(--border)"><strong style="font-family:var(--mono);font-size:.88rem">${Math.round(totalStock)}</strong></td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>`;
  }

  function renderStock() {
    const provOpts = ALL_PROVEEDORES.map(p => `<option value="${p}"${sfProveedor === p ? ' selected' : ''}>${p}</option>`).join('');

    document.getElementById('stockFilters').innerHTML = `
    <div class="panel" style="margin-bottom:1.25rem;overflow:visible">
      <div class="filter-bar">
        <span class="filter-label">Artículo:</span>
        <div style="position:relative;flex:1;max-width:320px">
          <input type="text" id="sfTextInput" placeholder="Buscar artículo para agregar…" value="${sfSearch.replace(/"/g,'&quot;')}"
            oninput="sfSearch=this.value;showSfDropdown()"
            onkeydown="if(event.key==='Enter'){event.preventDefault();sfKeepOpenOnBlur=true;}"
            onblur="setTimeout(()=>{if(sfKeepOpenOnBlur){sfKeepOpenOnBlur=false;const i=document.getElementById('sfTextInput');if(i)i.focus();return;}const d=document.getElementById('sfDropdown');if(d)d.style.display='none'},150)"
            onfocus="sfKeepOpenOnBlur=false;showSfDropdown()"
            style="width:100%;box-sizing:border-box" autofocus>
          <div id="sfDropdown" style="display:none;position:absolute;top:calc(100% + 2px);left:0;right:0;background:var(--surface);border:1px solid var(--border);border-radius:6px;max-height:280px;overflow-y:auto;z-index:9999;box-shadow:0 6px 24px rgba(0,0,0,.22)"></div>
        </div>
        <span class="filter-label">Proveedor:</span>
        <select onchange="sfProveedor=this.value;renderStockResults()" style="max-width:220px">
          <option value="">Todos</option>${provOpts}
        </select>
        <button class="btn-clear" onclick="sfSearch='';sfSelectedArticulos=new Set();sfProveedor='';sfColor='';sfTalle='';renderStock()" style="display:${sfSelectedArticulos.size > 0 || sfProveedor ? 'inline-flex' : 'none'}">✕ Limpiar</button>
      </div>
      <div id="sfChips" style="display:${sfSelectedArticulos.size > 0 ? 'flex' : 'none'};flex-wrap:wrap;gap:.4rem;padding:.5rem 1.25rem .75rem"></div>
    </div>`;

    renderChips();
    const inp = document.getElementById('sfTextInput');
    if (inp) { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
    renderStockResults();
  }

  function renderStockResults() {
    const hasSelection = sfSelectedArticulos.size > 0;
    const hasFilter = hasSelection || !!(sfSearch) || sfProveedor;

    // Update clear button
    const btn = document.querySelector('#stockFilters .btn-clear');
    if (btn) btn.style.display = (sfSelectedArticulos.size > 0 || sfProveedor) ? 'inline-flex' : 'none';

    let contentHTML;

    if (!hasFilter) {
      contentHTML = `<div class="panel"><div class="empty" style="padding:3rem 1.5rem;font-size:.95rem">Buscá artículos en el campo de arriba y seleccionalos para ver su stock</div></div>`;
    } else {
      let filteredRows;
      if (hasSelection) {
        filteredRows = stockData.filter(r => sfSelectedArticulos.has(r.articulo));
      } else {
        const t = norm(sfSearch);
        filteredRows = stockData.filter(r => {
          if (t && !norm(r.articulo).includes(t) && !norm(r.desc).includes(t)) return false;
          if (sfProveedor && !r.proveedores.includes(sfProveedor)) return false;
          return true;
        });
      }
      if (sfProveedor && hasSelection) {
        filteredRows = filteredRows.filter(r => r.proveedores.includes(sfProveedor));
      }

      if (filteredRows.length === 0) {
        contentHTML = `<div class="panel"><div class="empty">Sin resultados para los filtros seleccionados.</div></div>`;
      } else if (hasSelection && sfSelectedArticulos.size > 1) {
        // TABLA COMBINADA
        const codigos = [...sfSelectedArticulos];
        const all = buildAllArticulos();
        const labels = codigos.map(c => {
          const a = all.find(x => x.codigo === c);
          const precio = getPrice(c, a && a.desc);
          const precioTag = precio != null && precio > 0 ? `<span class="precio-tag-sm">${formatPrice(precio)}</span>` : '';
          return `<span class="mono-val" style="font-size:.9rem;color:var(--accent2)">${c}</span>${a && a.desc ? `<span style="font-size:.8rem;color:var(--muted)">  ${a.desc}</span>` : ''}${precioTag}`;
        }).join('<span style="color:var(--muted);margin:0 .3rem">+</span>');
        const titulo = `<div style="display:flex;align-items:center;gap:.3rem;flex-wrap:wrap">${labels}</div>`;
        const subtitulo = `Stock combinado · ${codigos.length} artículos`;
        contentHTML = buildStockTable(filteredRows, titulo, subtitulo);
      } else {
        // Una tabla por artículo (búsqueda de texto o 1 artículo seleccionado)
        const artMap = {};
        filteredRows.forEach(r => {
          if (!artMap[r.articulo]) artMap[r.articulo] = { codigo: r.articulo, desc: r.desc, proveedores: r.proveedores, rows: [] };
          artMap[r.articulo].rows.push(r);
        });
        const artList = Object.values(artMap).sort((a, b) => a.codigo.localeCompare(b.codigo));
        contentHTML = artList.map(art => {
          const precio = getPrice(art.codigo, art.desc);
          const precioTag = precio != null && precio > 0 ? `<span class="precio-tag">${formatPrice(precio)}</span>` : '';
          const titulo = `<span class="mono-val" style="font-size:1rem;color:var(--accent2)">${art.codigo}</span><span style="font-weight:600;font-size:.9rem">${art.desc}</span>${precioTag}`;
          const provStr = art.proveedores.length ? art.proveedores.join(', ') : '—';
          return buildStockTable(art.rows, titulo, provStr);
        }).join('');
      }
    }

    document.getElementById('stockLoading').style.display = 'none';
    document.getElementById('stockContent').style.display = 'block';
    document.getElementById('stockResults').innerHTML = contentHTML;
  }

  // ═══════════════════════════════════════════════════════════
  // SETUP / CONNECT
  // ═══════════════════════════════════════════════════════════
  async function connect() {
    SHEETS_ID = document.getElementById('sheetsId').value.trim() || SHEETS_ID_DEFAULT;
    SHEETS_GID = document.getElementById('sheetsGid').value.trim() || SHEETS_GID_DEFAULT;
    STOCK_PUB_ID = ''; // no usar CSV publicado como fuente principal
    const err = document.getElementById('errorMsg');
    err.style.display = 'none';
    const btn = document.querySelector('#setup .btn');
    btn.disabled = true; btn.textContent = 'Conectando…';
    try {
      localStorage.setItem('stockreal_sheets_id', SHEETS_ID);
      localStorage.setItem('stockreal_sheets_gid', SHEETS_GID);
      document.getElementById('setup').style.display = 'none';
      document.getElementById('dashboard').style.display = 'flex';
      loadData();
    } catch (e) {
      err.textContent = 'No se pudo conectar a Google Sheets.';
      err.style.display = 'block';
      btn.disabled = false; btn.textContent = 'Conectar →';
    }
  }

  function resetConfig() {
    ['stockreal_sheets_id','stockreal_sheets_gid'].forEach(k => localStorage.removeItem(k));
    location.reload();
  }

  // ═══════════════════════════════════════════════════════════
  // INIT
  // ═══════════════════════════════════════════════════════════
  window.addEventListener('DOMContentLoaded', () => {
    const sid = localStorage.getItem('stockreal_sheets_id');
    const sgid = localStorage.getItem('stockreal_sheets_gid');
    if (sid) {
      SHEETS_ID = sid;
      SHEETS_GID = sgid || SHEETS_GID_DEFAULT;
      STOCK_PUB_ID = ''; // no usar CSV publicado como fuente principal
      document.getElementById('setup').style.display = 'none';
      document.getElementById('dashboard').style.display = 'flex';
      loadData();
    }
  });

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw-stock-real.js').catch(() => {});
  }
</script>
</body>
</html>
